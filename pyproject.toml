[project]
name = "folio-jev-reviewer"
version = "1.0.0"
description = "A live, section-by-section research paper reviewer powered by Jev"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "pymupdf>=1.25,<2",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.0,<2",
  "beautifulsoup4>=4.13,<5",
  "scikit-learn>=1.6,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

